apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-crud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-crud
  template:
    metadata:
      labels:
        app: spring-crud
    spec:
      containers:
        - name: spring-crud
          image: spring-crud:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://host.docker.internal:3306/spring_crud
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spring-crud-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-crud-db-secret
                  key: password
